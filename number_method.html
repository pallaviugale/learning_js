<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        var a= Math.round(10.6);
        document.write("Round of value" + a +"<br>");

        var a= Math.round(10.4);
        document.write("Round of value" + a +"<br>");

        var a= Math.trunc(10.9);//round of without decimal
        document.write(" Trunc Round of value" + a +"<br>");

        var a= Math.ceil(10.1);//nearest upper value
        document.write(" Ceil Round of value" + a +"<br>");

        var a= Math.floor(10.66);
        document.write(" Floor Round of value" + a +"<br>");

        var e = Math.max(45,56,78,98,8,56);
        document.write(" Max value :" + e +"<br>");

         var e = Math.min(45,56,78,98,8,56);
        document.write(" Min value :" + e +"<br>");

         var e = Math.sqrt(81);
        document.write("squareroot :" + e +"<br>");

        var e = Math.cbrt(125);
        document.write("cuberoot :" + e +"<br>");

        var e = Math.pow(2,4);
        document.write("power :" + e +"<br>");

        var e = Math.random();
        document.write("Random value :" + e +"<br>");

         var e = Math.floor(Math.random() * 100000);
        document.write("Random value :" + e +"<br>");

        var k = Math.PI.toFixed(3);
         document.write("PI value :" + k +"<br>");
       
           var k = Math.log(4).toFixed(2);
         document.write("log value :" + k +"<br>");



 </script>
</body>
</html>
