<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- syntax
    function functionName(){//function defination
        statement;
    }
    functionName(); -->
    <script>
        function hello(){
            document.write("hello its function example, <br>");

        }
        hello();
        hello();
        hello();
        hello();
        hello();
    </script>

    <!-- syntax
    function functionName(parameter1,parameter2){//function defination
        statement;
    }
    functionName(argument1,argument2); //function calling-->

    <script>
        function sum(a,b){
            document.write(a+b ,"<br>");
        }
        sum(3,8);
          sum(5,10);

    </script>

    <!-- arrow function example -->

    <script>
        const sum1=(a,b,c)=>document.write(a+b+c);
        sum1(32,56,76);
        
    </script>
</body>
</html>
