    <script>
        // arithmatic operator
        // +,-,*,%,/,++,--,**

        var a = 17;

        c++;//21
        c++;//22
        c--;//21
        c++;//22
        c--;//21
        c++;//22

    <script>
        //assignment operator
        //=,-=,+=,*=

        var x = 10;
        var y = 3;
        //x=x+y;

        x += y;
        document.write(x, "<br>");
        document.write(y);

        var x = 15;
        var y = 5;
        //x=x-y;

        x -= y;
        document.write(x, "<br>");
        document.write(y, "<br>");

        var x = 10;
        var y = 3;
        //x=x*y;

        x *= y;
        document.write(x, "<br>");
        document.write(y, "<br>");

        var x = 10;
        var y = 3;
        //x=x=y;

        x = y;
        document.write(x, "<br>");
        document.write(y, "<br>");

        //single operand =unary
        //double operand=binary




    </script>

    <script>
        //comparison operator

        //<,>,<=,>=,==,!=,===

        var p = 13;
        var q = 14;
        if (p > q) {
            document.write("true", "<br>");
        } else {
            document.write("false", "<br>");
        }

        var p = 13;
        var q = 14;
        if (p < q) {
            document.write("true", "<br>");
        } else {
            document.write("false", "<br>");
        }

        var p = 13;
        var q = 14;
        if (p = q) {
            document.write("true", "<br>");
        } else {
            document.write("false", "<br>");
        }

        var p = 13;
        var q = 14;
        if (p >= q) {
            document.write("true", "<br>");
        } else {
            document.write("false", "<br>");
        }

        var p = 13;
        var q = 14;
        if (p <= q) {
            document.write("true", "<br>");
        } else {
            document.write("false", "<br>");
        }

        var p = 14;
        var q = "14";
        if (p == q) {
            document.write("true", "<br>");//only checks value
        } else {
            document.write("false", "<br>");
        }

        var p = 14;
        var q = "14";
        if (p === q) {
            document.write("true", "<br>");//checks value and datatype
        } else {
            document.write("false", "<br>");
        }


        var p = "14";
        var q = "14";
        if (p === q) {
            document.write("true", "<br>");//checks value and datatype
        } else {
            document.write("false", "<br>");
        }

    </script>
